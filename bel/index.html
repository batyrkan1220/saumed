<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Бел және омыртқаға арналған бандаж</title>
<meta name="description" content="Бағасын біліп, толық ақпарат алу үшін WhatsApp-қа жазыңыз.">
<meta name="theme-color" content="#1faa55">
<meta property="og:image" content="../img/bandaj.jpg">
<link rel="preload" as="image" href="../img/bandaj.webp" type="image/webp">
<!-- Пиксельдер админ беттен басқарылады (px.js) -->
<script async src="../px.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:#fff;color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
}
main{width:100%;max-width:440px;text-align:center}

.top{
  color:#13803f;font-weight:800;
  font-size:clamp(14px,4.2vw,17px);line-height:1.3;
  margin-bottom:10px;
}
.photo{display:block;margin:0 auto 12px}
.photo img{
  display:block;margin:0 auto;
  width:auto;max-width:100%;height:min(38vh,320px);
  border-radius:16px;
}
.title{
  font-size:clamp(21px,6.2vw,27px);font-weight:900;line-height:1.25;
  margin-bottom:16px;
}
.title span{color:#13803f}

/* Үлкен, анық батырма */
.wa{
  display:flex;align-items:center;justify-content:center;gap:12px;
  width:100%;min-height:76px;padding:12px 16px;
  background:#1faa55;color:#fff;text-decoration:none;
  border-radius:18px;
  font-size:clamp(17px,5.5vw,24px);font-weight:900;white-space:nowrap;
  box-shadow:0 5px 0 #13803f;
  animation:pulse 1.8s ease-in-out infinite;
}
.wa:active{transform:translateY(4px);box-shadow:0 1px 0 #13803f}
.wa svg{width:34px;height:34px;flex-shrink:0;fill:#fff}
.hint{margin-top:12px;font-size:clamp(15px,4.4vw,17px);color:#444;font-weight:600}

/* Төменде жабысып тұратын батырма (экранға сыймаса) */
.sticky{
  position:fixed;left:0;right:0;bottom:0;z-index:9;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  background:#fff;border-top:1px solid #e5e5e5;
  display:none;
}
.sticky.show{display:block}
.sticky .wa{max-width:440px;margin:0 auto;min-height:64px;animation:none}

@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){.wa{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="wa" viewBox="0 0 32 32"><path d="M16 3C9.4 3 4 8.4 4 15c0 2.4.7 4.6 1.9 6.5L4 29l7.7-1.9A12 12 0 0 0 16 27c6.6 0 12-5.4 12-12S22.6 3 16 3zm0 21.8c-1.8 0-3.5-.5-5-1.4l-.4-.2-4.6 1.1 1.1-4.4-.2-.4A9.8 9.8 0 0 1 6.2 15c0-5.4 4.4-9.8 9.8-9.8s9.8 4.4 9.8 9.8-4.4 9.8-9.8 9.8zm5.4-7.3c-.3-.1-1.7-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.4-1.5-.9-.8-1.5-1.7-1.6-2-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.8 1.2 3c.1.2 2.1 3.2 5 4.4.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3z"/></symbol></svg>

<main>
  <p class="top">БЕЛ ЖӘНЕ ОМЫРТҚА АУРУЛАРЫН ЕМДЕЙДІ</p>

  <a class="photo js-wa" href="../go.php" aria-label="WhatsApp-қа жазу">
    <picture>
      <source srcset="../img/bandaj.webp" type="image/webp">
      <img src="../img/bandaj.jpg" width="540" height="560" alt="Бел ауруына арналған ортопедиялық бандаж">
    </picture>
  </a>

  <h1 class="title">БАҒАСЫН БІЛІП ТОЛЫҚ АҚПАРАТ АЛУ ҮШІН <span>БАТЫРМАНЫ БАСЫҢЫЗ</span> 👇</h1>

  <a id="waBtn" class="wa js-wa" href="../go.php">
    <svg aria-hidden="true"><use href="#wa"/></svg>
    <span class="lbl">WHATSAPP-ҚА ЖАЗУ</span>
  </a>
  <p class="hint">Бір басыңыз — WhatsApp ашылады</p>
</main>

<div class="sticky" id="sticky">
  <a class="wa js-wa" href="../go.php" tabindex="-1">
    <svg aria-hidden="true"><use href="#wa"/></svg>
    <span class="lbl">WHATSAPP-ҚА ЖАЗУ</span>
  </a>
</div>

<script>
(function () {
  function sg(s, k) { try { return s.getItem(k); } catch (e) { return null; } }
  function ss(s, k, v) { try { s.setItem(k, v); } catch (e) {} }
  var LS = window.localStorage, SS = window.sessionStorage;

  // Келушінің ID-і (бірегей келушілерді санау үшін)
  var vid = sg(LS, 'vid');
  if (!vid) { vid = Date.now().toString(36) + Math.random().toString(36).slice(2, 10); ss(LS, 'vid', vid); }
  document.cookie = 'vid=' + vid + ';path=/;max-age=31536000;samesite=lax';

  // Қайдан келгенін анықтау
  var q = new URLSearchParams(location.search);
  var src = (q.get('utm_source') || '').toLowerCase();
  if (!src) src = q.get('ttclid') ? 'tiktok' : q.get('fbclid') ? 'facebook' : q.get('gclid') ? 'google' : '';
  if (!src && document.referrer) {
    try {
      var h = new URL(document.referrer).hostname.replace(/^www\./, '');
      if (h && h !== location.hostname) {
        src = h;
        var k = ['tiktok', 'instagram', 'facebook', 'google', 'youtube', 'vk', 'yandex', 'telegram'];
        for (var i = 0; i < k.length; i++) if (h.indexOf(k[i]) > -1) { src = k[i]; break; }
      }
    } catch (e) {}
  }
  src = src || sg(SS, 'src') || ''; ss(SS, 'src', src);
  var cmp = (q.get('utm_campaign') || sg(SS, 'cmp') || '').toLowerCase(); ss(SS, 'cmp', cmp);
  var mg = (q.get('m') || sg(SS, 'm') || '').replace(/[^a-zA-Z0-9]/g, ''); ss(SS, 'm', mg);

  var url = '../go.php?vid=' + encodeURIComponent(vid) + '&src=' + encodeURIComponent(src) +
            '&cmp=' + encodeURIComponent(cmp) + (mg ? '&m=' + encodeURIComponent(mg) : '');

  // Батырма, сурет — бәрі WhatsApp-қа апарады
  var busy = false, links = document.querySelectorAll('.js-wa');
  function go(e) {
    e.preventDefault();
    if (busy) return;
    busy = true;
    var l = document.querySelectorAll('.lbl');
    for (var j = 0; j < l.length; j++) l[j].textContent = 'АШЫЛУДА...';
    if (typeof window.__pxClick === 'function') { try { window.__pxClick(); } catch (er) {} }
    setTimeout(function () { location.href = url; }, 120);
  }
  for (var b = 0; b < links.length; b++) { links[b].href = url; links[b].addEventListener('click', go); }

  // Кіруді тіркеу (бет ашылғаннан кейін, жылдамдыққа әсер етпейді)
  setTimeout(function () {
    try {
      var fd = new FormData();
      fd.append('vid', vid); fd.append('src', src); fd.append('cmp', cmp); fd.append('m', mg);
      if (navigator.sendBeacon) navigator.sendBeacon('../track.php', fd);
      else fetch('../track.php', { method: 'POST', body: fd, keepalive: true });
    } catch (e) {}
  }, 0);

  // Негізгі батырма экранға сыймаса — төменнен шығады
  var st = document.getElementById('sticky');
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (en) { st.classList.toggle('show', !en[0].isIntersecting); })
      .observe(document.getElementById('waBtn'));
  }

  // WhatsApp-тан артқа қайтқанда
  window.addEventListener('pageshow', function () {
    busy = false;
    var l = document.querySelectorAll('.lbl');
    for (var j = 0; j < l.length; j++) l[j].textContent = 'WHATSAPP-ҚА ЖАЗУ';
  });
})();
</script>
</body>
</html>
